appId: com.joclegg.puzzles
name: Daily puzzle - starts one level's puzzle, and resumes it the same day
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "game_sudoku"
    centerElement: true
- tapOn:
    id: "game_sudoku"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "daily_medium"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "game_title"
- tapOn:
    id: "back"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "daily_medium"
- waitForAnimationToEnd:
    timeout: 1500
- assertNotVisible:
    id: "resume_dialog"
- assertVisible:
    id: "timer"
