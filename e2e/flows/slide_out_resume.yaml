appId: com.joclegg.puzzles
name: Slide Out - a level in progress offers Resume, and Continue reopens it
tags:
  - fast
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "game_slide_out"
    timeout: 120000
- tapOn:
    id: "game_slide_out"
- tapOn:
    id: "level_easy"
- assertVisible:
    id: "game_title"
    text: "Easy"
- tapOn:
    id: "back"
- assertVisible:
    id: "continue"
- tapOn:
    id: "level_easy"
- assertVisible:
    id: "resume_dialog"
- tapOn:
    id: "resume_game"
- assertVisible:
    id: "game_title"
    text: "Easy"
- tapOn:
    id: "back"
- tapOn:
    id: "continue"
- assertVisible:
    id: "game_title"
    text: "Easy"
