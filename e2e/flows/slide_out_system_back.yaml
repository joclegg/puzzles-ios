appId: com.joclegg.puzzles
name: Slide Out - the system back swipe leaves the game for Home
---
- launchApp:
    clearState: true
    arguments:
      fixture: "slide_out_two_moves"
- extendedWaitUntil:
    visible:
      id: "move_count"
    timeout: 120000
- swipe:
    start: "1%, 50%"
    end: "90%, 50%"
- extendedWaitUntil:
    visible:
      id: "level_beginner"
    timeout: 5000
