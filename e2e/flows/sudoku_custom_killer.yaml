appId: com.joclegg.puzzles
name: Custom killer - draw cages with sums, then play it
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "game_sudoku"
    centerElement: true
- tapOn:
    id: "game_sudoku"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "mode_killer"
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "enter_puzzle"
- tapOn:
    id: "enter_puzzle"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "entry_killer"
    selected: true
- tapOn:
    id: "cage_tool"
- tapOn:
    id: "cell_r1c1"
- tapOn:
    id: "cell_r1c2"
- tapOn:
    id: "digit_1"
- tapOn:
    id: "digit_7"
- assertVisible:
    id: "entry_status"
    text: "Cage sum: 17"
- tapOn:
    id: "confirm_cage"
- assertNotVisible:
    id: "entry_problem"
- assertVisible:
    id: "cage_sum_r1c1"
    text: "17"
- tapOn:
    id: "cage_tool"
- tapOn:
    id: "cell_r5c5"
- tapOn:
    id: "digit_5"
- tapOn:
    id: "fix_puzzle"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "unverified_dialog"
- tapOn:
    id: "play_anyway"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "game_title"
    text: "Custom killer"
- assertVisible:
    id: "cell_r5c5"
    text: "5"
- assertVisible:
    id: "mistakes"
    text: "Mistakes: 0"
