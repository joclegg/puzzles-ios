appId: com.joclegg.puzzles
name: Word Wheel - rules, settings and the walkthrough
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: "game_word_wheel"
- tapOn:
    id: "game_word_wheel"
- tapOn:
    id: "level_5"
- assertVisible:
    id: "game_title"
    text: "5 letters"
- tapOn:
    id: "rules"
- tapOn:
    id: "walkthrough_start"
- assertVisible:
    id: "walkthrough_text"
    text: "Find every word in this crossword."
- tapOn:
    id: "walkthrough_next"
- tapOn:
    id: "walkthrough_close"
- tapOn:
    id: "game_menu"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "Settings"
- assertVisible:
    id: "setting_show_timer"
- tapOn:
    id: "setting_show_hints"
- tapOn:
    id: "back"
- assertNotVisible:
    id: "hint"
- tapOn:
    id: "game_menu"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "Show solution"
- tapOn:
    id: "confirm_reveal"
- assertVisible:
    id: "words_left"
    text: "0 to find"
