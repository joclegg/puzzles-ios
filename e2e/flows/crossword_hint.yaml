appId: com.joclegg.puzzles
name: Crossword - with hints on, a hint points at the next letter and, set to fill, fills it in
---
- launchApp:
    clearState: true
    arguments:
      fixture: "crossword_empty"
- waitForAnimationToEnd:
    timeout: 1500
- assertNotVisible:
    id: "hint"
- tapOn:
    id: "game_menu"
- tapOn:
    id: "menu_settings"
- tapOn:
    id: "setting_show_hints"
- tapOn:
    id: "back"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "hint"
- assertVisible:
    id: "hint_message"
    text: "Try C here."
- tapOn:
    id: "game_menu"
- tapOn:
    id: "menu_settings"
- tapOn:
    id: "setting_hint_fill"
- tapOn:
    id: "back"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "hint"
- assertVisible:
    id: "cell_r1c1"
    text: "C"
