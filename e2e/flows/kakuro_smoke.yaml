appId: com.joclegg.puzzles
name: Kakuro - start an 8 x 8 puzzle
tags:
  - fast
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "game_kakuro"
    timeout: 120000
- tapOn:
    id: "game_kakuro"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "size_8"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "game_title"
    text: "8 x 8"
- assertVisible:
    id: "digit_9"
