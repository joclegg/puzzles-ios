appId: com.joclegg.puzzles
name: Kakuro - Show solution fills the grid and ends the puzzle
---
- launchApp:
    clearState: true
    arguments:
      helpers: "on"
      fixture: "kakuro_empty"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "game_menu"
- tapOn:
    id: "menu_solution"
- tapOn:
    id: "confirm_reveal"
- assertVisible:
    id: "hint"
    enabled: false
