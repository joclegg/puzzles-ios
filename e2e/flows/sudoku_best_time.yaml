appId: com.joclegg.puzzles
name: Completing a puzzle records a best time and history entry
---
- launchApp:
    clearState: true
    arguments:
      fixture: "classic_one_left"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "cell_r1c3"
- tapOn:
    id: "digit_4"
- assertVisible:
    id: "solved_screen"
- assertVisible:
    id: "new_best"
- tapOn:
    id: "solved_home"
- extendedWaitUntil:
    visible:
      id: "stats"
    timeout: 15000
- tapOn:
    id: "stats"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "best_classic_easy_solved"
    text: "1"
- tapOn:
    id: "back"
- tapOn:
    id: "history"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "history_item"
- assertVisible: ".*Classic · Easy.*"
