appId: com.joclegg.puzzles
name: Crossword - typing the last letter solves the puzzle and goes back to Crossword's Home
tags:
  - fast
---
- launchApp:
    clearState: true
    arguments:
      fixture: "crossword_one_left"
- waitForAnimationToEnd:
    timeout: 1500
- inputText: "W"
- assertVisible:
    id: "solved_dialog"
- tapOn:
    id: "solved_home"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "size_11"
