name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the unsigned simulator app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"
      - name: Work out the version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - name: Build the simulator app
        run: |
          xcodebuild -project Puzzles.xcodeproj -scheme PuzzlesApp -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build build -quiet \
            MARKETING_VERSION=${{ steps.gitversion.outputs.majorMinorPatch }}
          ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/Puzzles.app \
            "puzzles-${{ steps.gitversion.outputs.majorMinorPatch }}-simulator.zip"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.gitversion.outputs.majorMinorPatch }}"
          "puzzles-${{ steps.gitversion.outputs.majorMinorPatch }}-simulator.zip"
          --target "$GITHUB_SHA" --title "Puzzles ${{ steps.gitversion.outputs.majorMinorPatch }}" --generate-notes
