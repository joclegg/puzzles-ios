name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  release:
    name: Upload to TestFlight and publish the simulator app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"
      - name: Work out the version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - name: Build the simulator app
        run: |
          xcodebuild -project Puzzles.xcodeproj -scheme PuzzlesApp -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build build -quiet \
            MARKETING_VERSION=${{ steps.gitversion.outputs.majorMinorPatch }} \
            CURRENT_PROJECT_VERSION=$(git rev-list --count HEAD)
          ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/Puzzles.app \
            "puzzles-${{ steps.gitversion.outputs.majorMinorPatch }}-simulator.zip"
      - name: Sign, upload to TestFlight and update the App Store listing
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "$API_KEY" | base64 --decode > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild archive -project Puzzles.xcodeproj -scheme PuzzlesApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Puzzles.xcarchive" -quiet \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ steps.gitversion.outputs.majorMinorPatch }} \
            CURRENT_PROJECT_VERSION=$(git rev-list --count HEAD)
          codesign --force --sign - --entitlements Puzzles.entitlements \
            "$RUNNER_TEMP/Puzzles.xcarchive/Products/Applications/Puzzles.app"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string upload" -c "Add :signingStyle string automatic" \
            -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Puzzles.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${AUTH[@]}"
          KEY_PATH="$KEY_PATH" KEY_ID="$KEY_ID" ISSUER_ID="$ISSUER_ID" \
            python3 -I scripts/upload-store-listing.py ${{ steps.gitversion.outputs.majorMinorPatch }}
          rm -f "$KEY_PATH"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.gitversion.outputs.majorMinorPatch }}"
          "puzzles-${{ steps.gitversion.outputs.majorMinorPatch }}-simulator.zip"
          --target "$GITHUB_SHA" --title "Puzzles ${{ steps.gitversion.outputs.majorMinorPatch }}" --generate-notes
