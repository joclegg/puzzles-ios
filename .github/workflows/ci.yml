name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: xcrun swift-format lint --strict --recursive App Sources Tests Package.swift
      - run: scripts/verify-no-comments.sh
      - run: swift test -c release -Xswiftc -enable-testing

  build:
    name: Build for the simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -project Puzzles.xcodeproj -scheme PuzzlesApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build build -quiet
      - run: ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/Puzzles.app Puzzles.app.zip
      - uses: actions/upload-artifact@v7
        with:
          name: puzzles-app
          path: Puzzles.app.zip
          retention-days: 3

  e2e:
    name: Maestro e2e (part ${{ matrix.part }} of 5)
    runs-on: macos-26
    needs: build
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
      E2E_APP_PATH: Puzzles.app
    steps:
      - uses: actions/checkout@v7
      - name: Boot the simulator in the background
        run: |
          UDID=$(xcrun simctl list devices available | grep -F "iPhone 17 (" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$UDID" || true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v7
        with:
          name: puzzles-app
      - run: ditto -x -k Puzzles.app.zip .
      - run: e2e/run.sh --part ${{ matrix.part }}/5
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-part-${{ matrix.part }}
          path: ~/.maestro/tests

  e2e-result:
    name: Maestro e2e
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - if: needs.e2e.result != 'success'
        run: exit 1
